name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: FinanceKit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: swift test
        run: swift test --package-path Packages/FinanceKit

  app-build:
    name: iOS app build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: xcodebuild
        run: >
          xcodebuild build
          -project MoneyTalks.xcodeproj
          -scheme MoneyTalks
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
